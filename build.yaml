targets:
  $default:
    sources:
      - $package$
      - lib/**
      - lib/plugin.dart
      - proto/**
      - tool/**
    builders:
      protoc_builder:
        options:
          out_dir: lib/src/generated
          protobuf_version: "30.2"
          protoc_plugin: "22.0.1"
builders:
  plugin_generator:
    import: 'tool/plugin_generator.dart'
    builder_factories: ["getBuilder"]
    build_extensions: {".dart": [".plugin.g.part"]}
    auto_apply: root_package
    build_to: source
    required_inputs:
      - lib/plugin_template.mustache